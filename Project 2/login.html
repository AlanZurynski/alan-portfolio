<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="center">

<div class="login-box">
  <h1>Inloggen</h1>

  <form id="loginForm">
    <input type="text" id="username" placeholder="Gebruikersnaam" class="input">
    <small id="userError" class="error"></small>

    <input type="password" id="password" placeholder="Wachtwoord" class="input">
    <small id="passError" class="error"></small>

    <button class="btn btn1">Inloggen</button>
  </form>
</div>

<script src="login.js"></script>
</body>
</html>
